# ТОЛЬКО ДЛЯ ЛОКАЛЬНОЙ РАЗРАБОТКИ.
# Пароль здесь заведомо слабый — в продакшене этот файл не используется,
# там своя, отдельно настроенная база (см. README, раздел «Обновление на сервере»).
services:
  db:
    image: postgres:16-alpine
    container_name: education-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_portal
    ports:
      # Только loopback: иначе база с паролем postgres/postgres
      # слушает все интерфейсы машины.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d education_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
